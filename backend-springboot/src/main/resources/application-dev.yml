# 数据源配置
spring:
  datasource:
    prod1:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.jdbc.Driver
      jdbc-url: ${MYSQL_URL:jdbc:mysql://localhost:3306/duzhe_study?useUnicode=true&characterEncoding=utf8&nullCatalogMeansCurrent=true&zeroDateTimeBehavior=CONVERT_TO_NULL&useSSL=true&serverTimezone=GMT%2B8}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:replace-with-your-mysql-password}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/works?maxPoolSize=512}
    elasticsearch:
      hostname: ${ELASTICSEARCH_HOST:localhost}
      port: ${ELASTICSEARCH_PORT:9200}
      server:
        servlet:
          context-path: /duzhe/duzhe_New
